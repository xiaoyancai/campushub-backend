openapi: 3.0.3
info:
  title: CampusHub Reservation API
  version: 1.0.0
  description: API specification for managing campus resources and time-slotted reservations.
servers:
  - url: http://localhost:3000/api/v1
    description: Local Development Server
security: []
paths:
  /resources:
    get:
      operationId: listResources
      summary: List resources with optional type and availability filters
      parameters:
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum:
              - ROOM
              - EQUIPMENT
              - LAB
        - name: isAvailable
          in: query
          required: false
          description: Operational availability; only literal true or false is accepted.
          schema:
            type: boolean
      responses:
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedCharset"
        "200":
          description: Matching resources.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Resource"
        "400":
          description: Invalid input, timestamp, time range, unknown resource, malformed JSON, or invalid URL parameter encoding.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /reservations:
    post:
      operationId: createReservation
      summary: Create a time-slotted reservation
      description:
        Send only resourceId, userId, startTime and endTime. endTime must
        be after startTime. PENDING and CONFIRMED reservations block overlapping half-open
        intervals [startTime, endTime); adjacent slots are allowed. Compare instants
        with timezone offsets. Unavailable resources return 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Reservation"
            example:
              resourceId: res-101
              userId: user-456
              startTime: "2026-10-01T10:00:00Z"
              endTime: "2026-10-01T11:00:00Z"
      responses:
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedCharset"
        "201":
          description: Created reservation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "409":
          description:
            DOUBLE_BOOKING for overlap or RESOURCE_UNAVAILABLE for unavailable
            resource.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Invalid input, timestamp, time range, unknown resource, malformed JSON, or invalid URL parameter encoding.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /reservations/user/{userId}:
    get:
      operationId: listUserReservations
      summary: List all student reservations
      description:
        Includes PENDING, CONFIRMED and CANCELLED bookings, sorted by startTime
        and ID. Unknown users return an empty array.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            pattern: \S
      responses:
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedCharset"
        "200":
          description: All reservations for the student.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reservation"
        "400":
          description: Invalid input, timestamp, time range, unknown resource, malformed JSON, or invalid URL parameter encoding.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /reservations/{id}:
    get:
      operationId: getReservation
      summary: Get a reservation by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedCharset"
        "500":
          $ref: "#/components/responses/InternalError"
        "200":
          description: Reservation found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "404":
          description: Reservation not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: cancelReservation
      summary: Cancel a reservation
      description: Marks the reservation CANCELLED, retaining it for lookup and releasing its time slot. Repeated cancellation returns 204.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedCharset"
        "500":
          $ref: "#/components/responses/InternalError"
        "204":
          description: Reservation cancelled successfully. No response body.
        "404":
          description: Reservation not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /reservations/{id}/cancel:
    patch:
      operationId: cancelReservationStatus
      summary: Cancel a reservation
      description: Idempotently marks a reservation CANCELLED and frees its slot. Cancellation is terminal.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedCharset"
        "204":
          description: Cancelled successfully. No response body.
        "404":
          description: Reservation not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /reservations/{id}/confirm:
    patch:
      operationId: confirmReservationStatus
      summary: Confirm a reservation
      description: Transitions PENDING to CONFIRMED. Already confirmed is idempotent; CANCELLED returns 409.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedCharset"
        "200":
          description: Confirmed reservation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "409":
          description: INVALID_TRANSITION; cancelled reservations cannot be confirmed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Reservation not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  responses:
    InvalidRequest:
      description: Invalid URL parameter encoding or malformed JSON request body.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: VALIDATION_ERROR
            message: Invalid URL parameter encoding.
    BodyTooLarge:
      description: Request body exceeds the JSON parser limit (100 KB).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: PAYLOAD_TOO_LARGE
            message: Request body is too large.
    UnsupportedCharset:
      description: Unsupported request charset for JSON parsing.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: UNSUPPORTED_CHARSET
            message: Unsupported request charset.
    InternalError:
      description: Unexpected server error; internal details are never returned.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: INTERNAL_ERROR
            message: Internal server error
  schemas:
    Resource:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - type
        - location
        - isAvailable
      properties:
        id:
          type: string
          minLength: 1
          pattern: \S
        name:
          type: string
          minLength: 1
          pattern: \S
        type:
          type: string
          enum:
            - ROOM
            - EQUIPMENT
            - LAB
        location:
          type: string
          minLength: 1
          pattern: \S
        isAvailable:
          type: boolean
          description: Operational availability; slot occupancy is checked separately.
    Reservation:
      type: object
      additionalProperties: false
      required:
        - id
        - resourceId
        - userId
        - startTime
        - endTime
        - status
      properties:
        id:
          type: string
          readOnly: true
          description: Server-generated ID; omit from requests.
        resourceId:
          type: string
          minLength: 1
          pattern: \S
        userId:
          type: string
          minLength: 1
          pattern: \S
        startTime:
          type: string
          format: date-time
          pattern: ^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])T([01]\d|2[0-3]):[0-5]\d:[0-5]\d(\.\d{1,3})?(Z|[+-]([01]\d|2[0-3]):[0-5]\d)$
          description:
            Valid calendar date, required timezone, uppercase T/Z, optional
            1–3 fractional digits. Leap seconds are not supported.
        endTime:
          type: string
          format: date-time
          pattern: ^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])T([01]\d|2[0-3]):[0-5]\d:[0-5]\d(\.\d{1,3})?(Z|[+-]([01]\d|2[0-3]):[0-5]\d)$
          description:
            Valid calendar date, required timezone, uppercase T/Z, optional
            1–3 fractional digits. Leap seconds are not supported.
        status:
          type: string
          enum:
            - PENDING
            - CONFIRMED
            - CANCELLED
          readOnly: true
          description: Server-managed; omit from requests. New reservations are CONFIRMED.
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
