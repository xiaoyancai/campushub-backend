openapi: 3.0.3
info:
  title: CampusHub Reservation API
  version: 1.0.0
  description: Campus resource and reservation contract; in-memory teaching implementation.
  license:
    name: ISC
    url: https://opensource.org/license/isc-license-txt
servers:
  - url: http://localhost:3000/api/v1
    description: Local Development Server
security: []
paths:
  /resources:
    get:
      operationId: listResources
      summary: List resources with optional type filter
      parameters:
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum:
              - ROOM
              - EQUIPMENT
              - LAB
      responses:
        "200":
          description: Matching resources.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Resource"
        "400":
          description: Invalid input, timestamp, time range, or unknown resource.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /reservations:
    post:
      operationId: createReservation
      summary: Create a time-slotted reservation
      description:
        Send only resourceId, userId, startTime and endTime. endTime must
        be after startTime. PENDING and CONFIRMED reservations block overlapping half-open
        intervals [startTime, endTime); adjacent slots are allowed. Compare instants
        with timezone offsets. Unavailable resources return 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Reservation"
            example:
              resourceId: res-101
              userId: user-456
              startTime: "2026-10-01T10:00:00Z"
              endTime: "2026-10-01T11:00:00Z"
      responses:
        "201":
          description: Created reservation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "409":
          description:
            DOUBLE_BOOKING for overlap or RESOURCE_UNAVAILABLE for unavailable
            resource.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Invalid input, timestamp, time range, or unknown resource.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /reservations/user/{userId}:
    get:
      operationId: listUserReservations
      summary: List active student reservations
      description:
        Active means PENDING or CONFIRMED regardless of date. Excludes
        CANCELLED. Unknown users return an empty array.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            pattern: \S
      responses:
        "200":
          description: Active reservations.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reservation"
        "400":
          description: Invalid input, timestamp, time range, or unknown resource.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    Resource:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - type
        - location
        - isAvailable
      properties:
        id:
          type: string
          minLength: 1
          pattern: \S
        name:
          type: string
          minLength: 1
          pattern: \S
        type:
          type: string
          enum:
            - ROOM
            - EQUIPMENT
            - LAB
        location:
          type: string
          minLength: 1
          pattern: \S
        isAvailable:
          type: boolean
          description: Operational availability; slot occupancy is checked separately.
    Reservation:
      type: object
      additionalProperties: false
      required:
        - id
        - resourceId
        - userId
        - startTime
        - endTime
        - status
      properties:
        id:
          type: string
          readOnly: true
          description: Server-generated ID; omit from requests.
        resourceId:
          type: string
          minLength: 1
          pattern: \S
        userId:
          type: string
          minLength: 1
          pattern: \S
        startTime:
          type: string
          format: date-time
          pattern: ^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])T([01]\d|2[0-3]):[0-5]\d:[0-5]\d(\.\d{1,3})?(Z|[+-]([01]\d|2[0-3]):[0-5]\d)$
          description:
            Valid calendar date, required timezone, uppercase T/Z, optional
            1–3 fractional digits. Leap seconds are not supported.
        endTime:
          type: string
          format: date-time
          pattern: ^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])T([01]\d|2[0-3]):[0-5]\d:[0-5]\d(\.\d{1,3})?(Z|[+-]([01]\d|2[0-3]):[0-5]\d)$
          description:
            Valid calendar date, required timezone, uppercase T/Z, optional
            1–3 fractional digits. Leap seconds are not supported.
        status:
          type: string
          enum:
            - PENDING
            - CONFIRMED
            - CANCELLED
          readOnly: true
          description: Server-managed; omit from requests. New reservations are CONFIRMED.
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
